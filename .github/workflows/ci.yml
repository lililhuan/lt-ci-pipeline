# This file tells GitHub: "Every time someone pushes code, do these things."

name: CI Pipeline           # The name you'll see in the GitHub Actions tab

# WHEN should this run?
on:
  push:                     # Run when code is pushed...
    branches: [main]        # ...to the main branch
  pull_request:             # Also run on pull requests
    branches: [main]

# WHAT should it do?
jobs:
  check-code:
    name: Lint and Test
    runs-on: ubuntu-latest  # Use a Linux machine provided by GitHub

    steps:
      # Step 1: Download your code onto the runner
      - name: Get the code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install your packages (pip install)
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 5: Run tests
      - name: Run tests
        run: pytest tests/
  # This job runs AFTER "check-code" passes
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check-code            # Wait for lint+test to pass first!

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Verify image was created
        run: docker images | grep my-app
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d --name my-app -p 80:5000 ghcr.io/${{ github.repository }}:latest
            echo "Deployed successfully at $(date)"
      - run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.TOKEN }}/health)
          [ "$STATUS" = "200" ] && echo "App is running!" || (echo "Failed: $STATUS" && exit 1)
